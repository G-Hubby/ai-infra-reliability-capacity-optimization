<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="860" height="560" fill="#f8f9fa" rx="8"/>
  <text x="430" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Agentic AI Assistant — 3-Layer Architecture</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#6c757d">Figure 5.1 · CSE599 Capstone · CSTU · Subhashish Mitra · August 2026</text>

  <!-- Layer 1: User Interaction (top) -->
  <rect x="30" y="62" width="800" height="110" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="50" y="82" font-size="12" font-weight="bold" fill="#5b21b6">Layer 1 — User Interaction</text>

  <rect x="60" y="90" width="170" height="64" rx="6" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="145" y="114" text-anchor="middle" font-size="11" fill="white" font-weight="bold">NL Query Interface</text>
  <text x="145" y="130" text-anchor="middle" font-size="9" fill="#e9d5ff">Natural Language Input</text>
  <text x="145" y="144" text-anchor="middle" font-size="9" fill="#e9d5ff">Operator Console</text>

  <rect x="265" y="90" width="170" height="64" rx="6" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="350" y="114" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Query Parser</text>
  <text x="350" y="130" text-anchor="middle" font-size="9" fill="#e9d5ff">Intent Classification</text>
  <text x="350" y="144" text-anchor="middle" font-size="9" fill="#e9d5ff">Entity Extraction</text>

  <rect x="470" y="90" width="170" height="64" rx="6" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="555" y="114" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Model Router</text>
  <text x="555" y="130" text-anchor="middle" font-size="9" fill="#e9d5ff">CHF / SDP / CLS / TEE</text>
  <text x="555" y="144" text-anchor="middle" font-size="9" fill="#e9d5ff">Query → Model Dispatch</text>

  <rect x="675" y="90" width="130" height="64" rx="6" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="740" y="114" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Session</text>
  <text x="740" y="130" text-anchor="middle" font-size="9" fill="#e9d5ff">Context Manager</text>
  <text x="740" y="144" text-anchor="middle" font-size="9" fill="#e9d5ff">State Tracking</text>

  <!-- Arrows Layer 1 -->
  <line x1="230" y1="122" x2="263" y2="122" stroke="#5b21b6" stroke-width="1.5" marker-end="url(#ap)"/>
  <line x1="435" y1="122" x2="468" y2="122" stroke="#5b21b6" stroke-width="1.5" marker-end="url(#ap)"/>
  <line x1="640" y1="122" x2="673" y2="122" stroke="#5b21b6" stroke-width="1.5" marker-end="url(#ap)"/>

  <!-- Down arrow L1 → L2 -->
  <line x1="430" y1="172" x2="430" y2="192" stroke="#374151" stroke-width="2" marker-end="url(#ad)"/>

  <!-- Layer 2: Intelligence (middle) -->
  <rect x="30" y="194" width="800" height="130" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="50" y="214" font-size="12" font-weight="bold" fill="#4c1d95">Layer 2 — Intelligence</text>

  <rect x="60" y="222" width="155" height="84" rx="6" fill="#6d28d9" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="137" y="246" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Inference Engine</text>
  <text x="137" y="262" text-anchor="middle" font-size="9" fill="#ddd6fe">CHF · R²=0.815</text>
  <text x="137" y="276" text-anchor="middle" font-size="9" fill="#ddd6fe">SDP · R²=0.736</text>
  <text x="137" y="290" text-anchor="middle" font-size="9" fill="#ddd6fe">CLS · F1=0.427</text>
  <text x="137" y="304" text-anchor="middle" font-size="9" fill="#ddd6fe">TEE · R²=0.003</text>

  <rect x="245" y="222" width="155" height="84" rx="6" fill="#6d28d9" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="322" y="246" text-anchor="middle" font-size="10" fill="white" font-weight="bold">SHAP Explainer</text>
  <text x="322" y="262" text-anchor="middle" font-size="9" fill="#ddd6fe">Feature Attribution</text>
  <text x="322" y="276" text-anchor="middle" font-size="9" fill="#ddd6fe">Top-4 drivers per model</text>
  <text x="322" y="290" text-anchor="middle" font-size="9" fill="#ddd6fe">Latency: 50–100 ms</text>
  <text x="322" y="304" text-anchor="middle" font-size="9" fill="#ddd6fe">with SHAP enabled</text>

  <rect x="430" y="222" width="155" height="84" rx="6" fill="#6d28d9" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="507" y="246" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Policy Engine</text>
  <text x="507" y="262" text-anchor="middle" font-size="9" fill="#ddd6fe">Risk Ranking</text>
  <text x="507" y="276" text-anchor="middle" font-size="9" fill="#ddd6fe">Mitigation Candidates</text>
  <text x="507" y="290" text-anchor="middle" font-size="9" fill="#ddd6fe">OCS Overlay (Table 6.2)</text>
  <text x="507" y="304" text-anchor="middle" font-size="9" fill="#ddd6fe">Priority Scoring</text>

  <rect x="615" y="222" width="190" height="84" rx="6" fill="#6d28d9" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="710" y="246" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Drift Monitor</text>
  <text x="710" y="262" text-anchor="middle" font-size="9" fill="#ddd6fe">PSI trigger: &gt; 0.20</text>
  <text x="710" y="276" text-anchor="middle" font-size="9" fill="#ddd6fe">CHF: quarterly refresh</text>
  <text x="710" y="290" text-anchor="middle" font-size="9" fill="#ddd6fe">SDP: monthly refresh</text>
  <text x="710" y="304" text-anchor="middle" font-size="9" fill="#ddd6fe">CLS: semi-annual</text>

  <!-- Arrows Layer 2 -->
  <line x1="215" y1="264" x2="243" y2="264" stroke="#4c1d95" stroke-width="1.5" marker-end="url(#ap2)"/>
  <line x1="400" y1="264" x2="428" y2="264" stroke="#4c1d95" stroke-width="1.5" marker-end="url(#ap2)"/>
  <line x1="585" y1="264" x2="613" y2="264" stroke="#4c1d95" stroke-width="1.5" marker-end="url(#ap2)"/>

  <!-- Down arrow L2 → HITL -->
  <line x1="430" y1="324" x2="430" y2="348" stroke="#374151" stroke-width="2" marker-end="url(#ad)"/>

  <!-- HITL GATE — Red, Prominent, Centered -->
  <rect x="200" y="350" width="460" height="72" rx="10" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
  <text x="430" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="white">✅  MANDATORY HITL APPROVAL GATE</text>
  <text x="430" y="393" text-anchor="middle" font-size="11" fill="#fecaca">Human-in-the-Loop · Non-Waivable Architectural Invariant</text>
  <text x="430" y="410" text-anchor="middle" font-size="10" fill="#fca5a5">55 s window · Operator must approve before any fabric state change</text>

  <!-- Down arrow HITL → L3 -->
  <line x1="430" y1="422" x2="430" y2="444" stroke="#374151" stroke-width="2" marker-end="url(#ad)"/>

  <!-- Layer 3: Action (bottom) -->
  <rect x="30" y="446" width="800" height="94" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="50" y="466" font-size="12" font-weight="bold" fill="#9d174d">Layer 3 — Action Execution</text>

  <rect x="60" y="474" width="140" height="52" rx="6" fill="#db2777" stroke="#9d174d" stroke-width="1.5"/>
  <text x="130" y="496" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Flow Rerouting</text>
  <text x="130" y="511" text-anchor="middle" font-size="9" fill="#fce7f3">Fabric path switch</text>

  <rect x="225" y="474" width="140" height="52" rx="6" fill="#db2777" stroke="#9d174d" stroke-width="1.5"/>
  <text x="295" y="496" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Dynamic QoS</text>
  <text x="295" y="511" text-anchor="middle" font-size="9" fill="#fce7f3">DCQCN adjustment</text>

  <rect x="390" y="474" width="140" height="52" rx="6" fill="#db2777" stroke="#9d174d" stroke-width="1.5"/>
  <text x="460" y="496" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Job Scheduling</text>
  <text x="460" y="511" text-anchor="middle" font-size="9" fill="#fce7f3">Staged GPU dispatch</text>

  <rect x="555" y="474" width="140" height="52" rx="6" fill="#db2777" stroke="#9d174d" stroke-width="1.5"/>
  <text x="625" y="496" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Node Drain</text>
  <text x="625" y="511" text-anchor="middle" font-size="9" fill="#fce7f3">Graceful eviction</text>

  <rect x="720" y="474" width="90" height="52" rx="6" fill="#db2777" stroke="#9d174d" stroke-width="1.5"/>
  <text x="765" y="493" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Rollback</text>
  <text x="765" y="508" text-anchor="middle" font-size="9" fill="#fce7f3">90 s window</text>

  <!-- Latency budget footer -->
  <text x="430" y="548" text-anchor="middle" font-size="10" fill="#374151">End-to-end latency budget:  Ingestion 30s · Inference 20s · SHAP 15s · HITL 55s  =  ≤ 120 s total</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#5b21b6"/>
    </marker>
    <marker id="ap2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4c1d95"/>
    </marker>
    <marker id="ad" markerWidth="8" markerHeight="8" refX="3" refY="6" orient="auto">
      <path d="M0,0 L6,0 L3,8 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
